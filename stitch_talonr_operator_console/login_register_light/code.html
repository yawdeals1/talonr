<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                      "surface-container-highest": "#e5e1e4",
                      "on-tertiary-fixed": "#001d32",
                      "on-secondary": "#ffffff",
                      "surface-tint": "#904d00",
                      "primary": "#8d4b00",
                      "on-tertiary-fixed-variant": "#004a75",
                      "inverse-on-surface": "#f3f0f2",
                      "error": "#ba1a1a",
                      "outline": "#887364",
                      "surface-variant": "#e5e1e4",
                      "tertiary": "#006096",
                      "on-background": "#1c1b1d",
                      "secondary-container": "#e3e1ec",
                      "surface-container-low": "#f6f2f5",
                      "on-tertiary": "#ffffff",

<style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=JetBrains+Mono:wght@450;500&display=swap');
        
        body {
            background-color: #fafafa; /* Zinc-50 */
            color: #09090b; /* Zinc-950 */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<!-- Auth Container -->
<div class="w-full max-w-md bg-white border border-zinc-200 rounded-lg shadow-xl overflow-hidden" id="auth-container">
<!-- Header -->
<div class="p-8 pb-6 text-center border-b border-zinc-200">
<h1 class="font-display text-display text-zinc-950 mb-2 tracking-tight">Talonr</h1>
<p class="font-body-sm text-body-sm text-zinc-500">Lead Intelligence Platform</p>
</div>
<!-- Tab Toggle -->
<div class="flex border-b border-zinc-200" role="tablist">
<button aria-controls="panel-login" aria-selected="true" class="flex-1 py-4 font-data-label text-data-label tracking-widest uppercase border-b-2 border-amber-600 text-amber-600 transition-colors focus:outline-none" id="tab-login" role="tab">
                Log In
            </button>
<button aria-controls="panel-register" aria-selected="false" class="flex-1 py-4 font-data-label text-data-label tracking-widest uppercase border-b-2 border-transparent text-zinc-500 hover:text-zinc-700 transition-colors focus:outline-none" id="tab-register" role="tab">
                Register
            </button>
</div>
<div class="p-8">
<!-- Login Form -->
<form aria-labelledby="tab-login" class="space-y-6" id="form-login" role="tabpanel">
<div class="space-y-2">
<label class="block font-data-label text-data-label text-zinc-600" for="login-email">Email Address</label>
<input class="w-full bg-zinc-50 border border-zinc-300 text-zinc-950 font-data-mono text-data-mono px-4 py-2 rounded focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600 transition-colors" id="login-email" name="email" placeholder="analyst@talonr.com" required="" type="email"/>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-data-label text-data-label text-zinc-600" for="login-password">Password</label>
<a class="font-data-label text-data-label text-zinc-500 hover:text-amber-600 transition-colors" href="#">Forgot?</a>
</div>
<input class="w-full bg-zinc-50 border border-zinc-300 text-zinc-950 font-data-mono text-data-mono px-4 py-2 rounded focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600 transition-colors" id="login-password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Example Error State (hidden by default) -->
<div class="hidden flex items-start gap-2 bg-red-50 border border-red-200 rounded p-3" id="login-error">
<span class="material-symbols-outlined text-red-500 text-sm" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-body-sm text-body-sm text-red-600 mt-0.5">Authentication failed. Please check your credentials and try again.</p>
</div>
<button class="w-full bg-amber-600 hover:bg-amber-700 text-white font-headline text-headline py-3 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 focus:ring-offset-white" type="submit">
                    Authenticate Session
                </button>
</form>
<!-- Register Form (Hidden initially) -->
<form aria-labelledby="tab-register" class="hidden space-y-6" id="form-register" role="tabpanel">
<div class="space-y-2">
<label class="block font-data-label text-data-label text-zinc-600" for="register-email">Work Email</label>
<input class="w-full bg-zinc-50 border border-zinc-300 text-zinc-950 font-data-mono text-data-mono px-4 py-2 rounded focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600 transition-colors" id="register-email" name="email" placeholder="analyst@company.com" required="" type="email"/>
</div>
<div class="space-y-2">
<label class="block font-data-label text-data-label text-zinc-600" for="register-password">Secure Password</label>
<input class="w-full bg-zinc-50 border border-zinc-300 text-zinc-950 font-data-mono text-data-mono px-4 py-2 rounded focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600 transition-colors" id="register-password" minlength="8" name="password" placeholder="Min. 8 characters" required="" type="password"/>
<p class="font-data-label text-data-label text-zinc-500 mt-1">Must contain at least 8 characters, 1 uppercase, 1 number.</p>
</div>
<div class="space-y-2">
<label class="block font-data-label text-data-label text-zinc-600" for="register-invite">Invitation Code (Optional)</label>
<input class="w-full bg-zinc-50 border border-zinc-300 text-zinc-950 font-data-mono text-data-mono px-4 py-2 rounded focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600 transition-colors" id="register-invite" name="invite" placeholder="TLNR-XXXX-XXXX" type="text"/>
</div>
<button class="w-full bg-amber-600 hover:bg-amber-700 text-white font-headline text-headline py-3 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 focus:ring-offset-white" type="submit">
                    Initialize Account
                </button>
<p class="text-center font-body-sm text-body-sm text-zinc-500 mt-4">
                    By creating an account, you agree to the <a class="text-amber-600 hover:underline" href="#">TOS</a> and <a class="text-amber-600 hover:underline" href="#">Privacy Policy</a>.
                </p>
</form>
</div>
<!-- System Status Footer -->
<div class="bg-zinc-100 p-4 border-t border-zinc-200 flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
<span class="font-data-label text-data-label text-zinc-600">API Status: Operational</span>
</div>
<span class="font-data-label text-data-label text-zinc-500">v2.4.1</span>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');

            const activeTabClasses = ['border-amber-600', 'text-amber-600'];
            const inactiveTabClasses = ['border-transparent', 'text-zinc-500'];

            function switchTab(isLogin) {
                if (isLogin) {
                    // Show Login
                    formLogin.classList.remove('hidden');
                    formRegister.classList.add('hidden');
                    
                    // Style Login Tab
                    tabLogin.classList.add(...activeTabClasses);
                    tabLogin.classList.remove(...inactiveTabClasses);
                    tabLogin.setAttribute('aria-selected', 'true');
                    
                    // Style Register Tab
                    tabRegister.classList.remove(...activeTabClasses);
                    tabRegister.classList.add(...inactiveTabClasses);
                    tabRegister.setAttribute('aria-selected', 'false');
                } else {
                    // Show Register
                    formRegister.classList.remove('hidden');
                    formLogin.classList.add('hidden');
                    
                    // Style Register Tab
                    tabRegister.classList.add(...activeTabClasses);
                    tabRegister.classList.remove(...inactiveTabClasses);
                    tabRegister.setAttribute('aria-selected', 'true');
                    
                    // Style Login Tab
                    tabLogin.classList.remove(...activeTabClasses);
                    tabLogin.classList.add(...inactiveTabClasses);
                    tabLogin.setAttribute('aria-selected', 'false');
                }
            }

            tabLogin.addEventListener('click', () => switchTab(true));
            tabRegister.addEventListener('click', () => switchTab(false));
            
            // Example form submission interception
            formLogin.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                const originalText = btn.innerText;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin inline-block align-middle mr-2 text-sm">progress_activity</span> Authenticating...';
                btn.disabled = true;
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    document.getElementById('login-error').classList.remove('hidden');
                }, 1500);
            });
        });
    </script>
</body></html>
